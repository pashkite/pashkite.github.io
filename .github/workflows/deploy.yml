name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Bundle VRoid models
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="./dist/prompt-studio/models"
          mkdir -p "$MODEL_DIR"
          BASE="https://raw.githubusercontent.com/iamenahs/xlunar-ai-avatar/main/public/avatars"
          curl -L --fail --retry 4 --retry-delay 2 "$BASE/VRoid_Sample_A.glb" -o "$MODEL_DIR/VRoid_Sample_A.glb"
          curl -L --fail --retry 4 --retry-delay 2 "$BASE/VRoid_Sample_B.glb" -o "$MODEL_DIR/VRoid_Sample_B.glb"
          curl -L --fail --retry 4 --retry-delay 2 "$BASE/VRoid_Sample_D.glb" -o "$MODEL_DIR/VRoid_Sample_D.glb"
          ls -lh "$MODEL_DIR"
      - name: Create .nojekyll
        run: touch ./dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
